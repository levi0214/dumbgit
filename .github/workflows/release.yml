name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/build-release.sh "$RELEASE_TAG"
      - name: Smoke test native binary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$(uname -m)" in
            arm64) archive=dist/release/dumbgit-darwin-arm64.tar.gz ;;
            x86_64) archive=dist/release/dumbgit-darwin-x64.tar.gz ;;
            *) exit 1 ;;
          esac
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          tar -xzf "$archive" -C "$test_dir"
          test "$("$test_dir/dg" --version)" = "dg ${RELEASE_TAG#v}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/release/dumbgit-darwin-arm64.tar.gz
          dist/release/dumbgit-darwin-x64.tar.gz
          dist/release/checksums.txt
          --clobber
