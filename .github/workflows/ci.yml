name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: sh -n install.sh scripts/build-release.sh scripts/build-npm-package.sh
      - run: bun run build
      - run: test "$(dist/dg --version)" = "dg dev"
      - run: scripts/build-npm-package.sh v0.0.0
      - name: Smoke test npm package
        run: |
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          npm install --global --prefix "$test_dir" dist/npm/*.tgz
          test "$("$test_dir/bin/dg" --version)" = "dg 0.0.0"
